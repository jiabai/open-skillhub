x-api-build: &api-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    - UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple

x-api-env: &api-env
  DATABASE_URL: sqlite+aiosqlite:////app/data/skilldrive.db
  HOME: /app/data
  SKILL_STORAGE_PATH: /app/data/skills
  TIMEZONE: "UTC+8"
  PYTHONPATH: /app

x-api-volumes: &api-volumes
  - skilldrive-data:/app/data

services:
  migrate:
    build: *api-build
    env_file:
      - backend/.env
    environment: *api-env
    volumes: *api-volumes
    command: ["/app/.venv/bin/alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    container_name: skilldrive-api
    build: *api-build
    env_file:
      - backend/.env
    environment: *api-env
    volumes: *api-volumes
    expose:
      - "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  webui:
    container_name: skilldrive-webui
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:3000}
        - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8001}
        - NPM_REGISTRY=https://registry.npmmirror.com
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

volumes:
  skilldrive-data:
