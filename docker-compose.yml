services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "1000:1000"
    command: sh -c "alembic -c backend/alembic.ini upgrade head && uvicorn backend.api_app:app --host 0.0.0.0 --port 8001 --workers 1"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/skillhub.db
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://39.107.59.41","http://39.107.59.41:80","http://39.107.59.41:8001"]'
      LOG_FILE: "/app/logs/skillhub.log"
      LOG_LEVEL: DEBUG
      SKILL_STORAGE_PATH: /data/skills
      TIMEZONE: "UTC+8"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./data/skills:/data/skills
    ports:
      - "8001:8001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://39.107.59.41:8001
        - API_INTERNAL_URL=http://api:8001
        - NEXT_PUBLIC_ENABLE_PUBLIC_SIGNUP=true
        - NEXT_PUBLIC_ENABLE_EMAIL_OTP_LOGIN=true
        - NEXT_PUBLIC_ENABLE_SSO=false
        - NEXT_PUBLIC_ENABLE_LDAP=false
        - NEXT_PUBLIC_ENABLE_AUDIT_LOG=true
        - NEXT_PUBLIC_ENABLE_AUDIT_EXPORT=true
        - NEXT_PUBLIC_ENABLE_ORG_MODEL=false
        - NEXT_PUBLIC_ENABLE_RBAC=false
        - NEXT_PUBLIC_ENABLE_SKILL_VISIBILITY=false
    ports:
      - "80:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M