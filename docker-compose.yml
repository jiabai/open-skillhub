services:
  api:
    container_name: open-skillhub-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "1000:1000"
    command: sh -c "alembic -c backend/alembic.ini upgrade head && uvicorn backend.api_app:app --host 0.0.0.0 --port 8001 --workers 1"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/skillhub.db
      LOG_FILE: "/app/logs/skillhub.log"
      SKILL_STORAGE_PATH: /app/data/skills
      TIMEZONE: "UTC+8"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    container_name: open-skillhub-webui
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://39.107.59.41
        - API_INTERNAL_URL=http://api:8001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
