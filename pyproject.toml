[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldrive"
dynamic = ["version"]
description = "A private Skills management SaaS for distributing skills to client-side runtimes."
authors = [
    { name = "jinli.yl", email = "jinli.yl@alibaba-inc.com" },
    { name = "caozouying.czy", email = "caozouying.czy@alibaba-inc.com" },
]
license = {file = "LICENSE"}
readme = "README.md"
keywords = [
  "llm", "agent", "skills",
  "skill-management", "skill-hub",
  "skill-distribution"
]
requires-python = ">=3.13"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "cryptography>=44.0.0",
    "PyYAML>=6.0.2",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "psutil>=6.0.0",
    "boto3>=1.36.0",
    "email-validator>=2.2.0",
    "ldap3>=2.9.1"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.2",
    "pytest_asyncio>=1.2.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML",
    "types-passlib",
    "types-psutil",
    "mkdocs-shadcn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
backend = [
    "**/*.yaml",
    "**/*.json",
]

[tool.setuptools.dynamic]
version = {attr = "backend.__version__"}

[project.urls]
Homepage = "https://github.com/jiabai/skilldrive"
Documentation = "https://github.com/jiabai/skilldrive/README.md"
Repository = "https://github.com/jiabai/skilldrive"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning",
    "ignore:tagMap is deprecated\\. Please use TAG_MAP instead\\.:DeprecationWarning",
    "ignore:typeMap is deprecated\\. Please use TYPE_MAP instead\\.:DeprecationWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ldap3"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.run_project_http", "tests.run_project_sse", "run_project_http", "run_project_sse"]
ignore_errors = true


